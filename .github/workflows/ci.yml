name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: swift build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      # RAW/OLYMPUS.ORF is deliberately not committed (see RAW/README.md), so
      # the fixture-backed suites skip themselves here. Everything else runs.
      - name: Test
        run: swift test
